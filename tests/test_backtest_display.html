<!doctype html>
<html>
  <head>
    <title>Test Backtest Display</title>
    <style>
      body {
        font-family: Arial;
        padding: 20px;
      }
      .test-result {
        margin: 10px 0;
        padding: 10px;
        border-radius: 5px;
      }
      .success {
        background: #d4edda;
        color: #155724;
      }
      .error {
        background: #f8d7da;
        color: #721c24;
      }
      .info {
        background: #d1ecf1;
        color: #0c5460;
      }
    </style>
  </head>
  <body>
    <h1>🧪 Backtest Display Test</h1>
    <div id="results"></div>
    <script>
      const results = document.getElementById('results');

      async function testBacktestAPI() {
        try {
          results.innerHTML +=
            '<div class="info">Testing API endpoint...</div>';

          const response = await fetch('http://localhost:7000/api/backtests');
          const data = await response.json();

          if (data.success && data.data && data.data.backtests) {
            const count = data.data.backtests.length;
            results.innerHTML += `<div class="success">✅ API Working: ${count} backtests found</div>`;

            results.innerHTML += '<h3>Strategies:</h3>';
            data.data.backtests.forEach((bt, i) => {
              const perf = bt.performance || {};
              const returnPct = ((perf.totalReturn || 0) * 100).toFixed(1);
              const winRatePct = ((perf.winRate || 0) * 100).toFixed(1);
              results.innerHTML += `
                            <div class="info">
                                ${i + 1}. <strong>${bt.strategy}</strong><br>
                                &nbsp;&nbsp;Return: ${returnPct}% | Win Rate: ${winRatePct}% | Trades: ${perf.totalTrades || 0}
                            </div>
                        `;
            });

            results.innerHTML +=
              '<div class="success">✅ All tests passed! Backtests should display correctly.</div>';
          } else {
            results.innerHTML +=
              '<div class="error">❌ API returned unexpected format</div>';
          }
        } catch (error) {
          results.innerHTML += `<div class="error">❌ Error: ${error.message}</div>`;
        }
      }

      testBacktestAPI();
    </script>
  </body>
</html>
