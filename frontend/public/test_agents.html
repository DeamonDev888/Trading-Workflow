<!doctype html>
<html>
  <head>
    <title>Test Agents Loading</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .test-result {
        margin: 10px 0;
        padding: 10px;
        border-radius: 5px;
      }
      .success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .agent-card {
        border: 1px solid #ddd;
        padding: 15px;
        margin: 10px 0;
        border-radius: 8px;
      }
      .status {
        font-weight: bold;
      }
      .running {
        color: #28a745;
      }
      .stopped {
        color: #dc3545;
      }
      .inferences-list {
        margin-top: 10px;
        padding: 10px;
        background: #f8f9fa;
        border-radius: 5px;
      }
      .inference-item {
        margin: 8px 0;
        padding: 8px;
        background: white;
        border-left: 3px solid #007bff;
        border-radius: 3px;
      }
      .inference-item p {
        margin: 5px 0;
        font-size: 0.9em;
      }
      .timestamp {
        color: #6c757d;
        font-size: 0.8em;
      }
      .data {
        font-family: monospace;
        background: #f1f1f1;
        padding: 5px;
        border-radius: 3px;
        font-size: 0.85em;
      }
      .no-data {
        color: #6c757d;
        font-style: italic;
      }
      h4 {
        margin-top: 15px;
        color: #495057;
      }
    </style>
  </head>
  <body>
    <h1>🤖 Test de Chargement des Agents</h1>

    <div id="test-results">
      <div class="test-result pending">Test de connexion à l'API agents...</div>
    </div>

    <div id="agents-container">
      <p>Chargement des agents...</p>
    </div>

    <h2>🎛️ Master Agent - Centre de Contrôle</h2>
    <div id="master-agent-container">
      <p>Chargement des données Master Agent...</p>
    </div>

    <script>
      async function testAgentsLoading() {
        const resultsDiv = document.getElementById('test-results');
        const agentsContainer = document.getElementById('agents-container');

        try {
          // Test 1: Connexion à l'API
          const response = await fetch('http://localhost:7000/api/agents/status');

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();

          resultsDiv.innerHTML = `
                    <div class="test-result success">
                        ✅ Connexion API réussie (Status: ${response.status})
                    </div>
                `;

          // Test 2: Vérification des données
          if (data.agents) {
            resultsDiv.innerHTML += `
                        <div class="test-result success">
                            ✅ Données reçues: ${data.agents.length} agent(s) trouvé(s)
                        </div>
                    `;

            // Afficher les agents
            const agentsHtml = data.agents
              .map(
                (agent) => `
                        <div class="agent-card">
                            <h3>${agent.name}</h3>
                            <p><strong>ID:</strong> ${agent.id}</p>
                            <p><strong>Status:</strong> <span class="status ${agent.status === 'active' || agent.status === 'running' ? 'running' : 'stopped'}">${agent.status}</span></p>
                            <p><strong>Confidence:</strong> ${agent.confidence || 'N/A'}%</p>
                            <p><strong>LLM Calls:</strong> ${agent.llmCalls || 'N/A'}</p>
                            <p><strong>Response Time:</strong> ${agent.responseTime || 'N/A'}ms</p>
                        </div>
                    `
              )
              .join('');

            agentsContainer.innerHTML = agentsHtml;

            resultsDiv.innerHTML += `
                        <div class="test-result success">
                            ✅ Affichage des agents réussi
                        </div>
                    `;
          } else {
            throw new Error('Aucun agent trouvé dans la réponse');
          }
        } catch (error) {
          resultsDiv.innerHTML = `
                    <div class="test-result error">
                        ❌ Erreur: ${error.message}
                    </div>
                `;

          agentsContainer.innerHTML = `
                    <div class="test-result error">
                        Impossible de charger les agents: ${error.message}
                    </div>
                `;
        }
      }

      async function loadMasterAgent() {
        const masterContainer = document.getElementById('master-agent-container');
        let html = '';

        try {
          // Charger le statut du Master Agent
          const statusResponse = await fetch('http://localhost:7000/api/agents/master/status');
          const statusData = await statusResponse.json();

          // Charger les logs récents
          const logsResponse = await fetch('http://localhost:7000/api/agents/master/logs?limit=5');
          const logsData = await logsResponse.json();

          // Charger les performances
          const perfResponse = await fetch('http://localhost:7000/api/agents/master/performance');
          const perfData = await perfResponse.json();

          // Construire le HTML
          html = `
            <div class="agent-card">
              <h3>🎛️ Master Agent</h3>
              <p><strong>Status:</strong> <span class="status ${statusData.status === 'RUNNING' ? 'running' : 'stopped'}">${statusData.status}</span></p>
              <p><strong>System Status:</strong> ${statusData.system_status || 'UNKNOWN'}</p>
              <p><strong>Total Cycles:</strong> ${statusData.total_cycles || 0}</p>
              <p><strong>Last Update:</strong> ${statusData.last_update || 'Never'}</p>

              <h4>📊 Performance</h4>
              <p><strong>Status:</strong> ${perfData.status || 'N/A'}</p>
              <p><strong>Success Rate:</strong> ${perfData.success_rate || 0}%</p>
              <p><strong>Average Duration:</strong> ${perfData.average_duration || 0}s</p>
              <p><strong>Total Decisions:</strong> ${perfData.total_decisions || 0}</p>

              <h4>💭 Recent Thoughts (Logs)</h4>
              <div class="inferences-list">
                ${logsData.logs && logsData.logs.length > 0
                  ? logsData.logs.map(log => `
                      <div class="inference-item">
                        <p><strong>${log.category}</strong> - ${log.event_type}</p>
                        <p class="timestamp">${new Date(log.timestamp).toLocaleString()}</p>
                        <p class="data">${JSON.stringify(log.data, null, 2)}</p>
                      </div>
                    `).join('')
                  : '<p class="no-data">No recent thoughts</p>'
                }
              </div>
            </div>
          `;

          masterContainer.innerHTML = html;
        } catch (error) {
          masterContainer.innerHTML = `
            <div class="agent-card">
              <h3>🎛️ Master Agent</h3>
              <div class="test-result error">
                ❌ Erreur: ${error.message}
              </div>
            </div>
          `;
        }
      }

      // Lancer les tests au chargement de la page
      window.onload = () => {
        testAgentsLoading();
        loadMasterAgent();
      };
    </script>
  </body>
</html>
