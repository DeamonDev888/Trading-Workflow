<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVAQUOTE - Configuration: Agents & Permissions</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="assets/novaquote.css" rel="stylesheet">

</head>
<body>
    <!-- Navigation -->
    <nav class="nav-bar">
        <div class="nav-content">
            <a href="/" class="nav-brand">
                📊 NOVAQUOTE
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link">
                    <i class="fas fa-home"></i>
                    Dashboard
                </a>
                <a href="/backtest" class="nav-link">
                    <i class="fas fa-chart-line"></i>
                    Backtests
                </a>
                <a href="/config" class="nav-link active">
                    <i class="fas fa-cogs"></i>
                    Configuration
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <!-- Banner -->
        <div class="banner">
            <div class="banner-content">
                <h1>🔗 Connexion Wallet</h1>
                <p>Connectez votre wallet MetaMask pour commencer</p>
            </div>
        </div>

        <!-- Permissions Tab Content -->
        <div id="permissions-tab" class="tab-content">
            <!-- Wallet Connection Card -->
            <div class="card" style="text-align: center; padding: 3rem;">
                <div style="font-size: 4rem; margin-bottom: 1rem;">💼</div>
                <h2 style="color: var(--text-primary); margin-bottom: 1rem;">Connectez votre wallet</h2>
                <p style="color: var(--text-secondary); margin-bottom: 2rem;">Choisissez votre wallet pour commencer</p>

                <div class="wallet-actions" style="margin-top: 2rem;">
                    <button class="control-btn primary" id="connect-metamask-btn" style="font-size: 1.1rem; padding: 1rem 2rem;">
                        <i class="fab fa-ethereum"></i>
                        Connecter MetaMask
                    </button>
                    <button class="control-btn secondary" id="disconnect-wallet-btn" style="display: none; font-size: 1.1rem; padding: 1rem 2rem; margin-top: 1rem;">
                        <i class="fas fa-unlink"></i>
                        Déconnecter
                    </button>
                </div>

                <div id="wallet-info-display" style="display: none; margin-top: 2rem; text-align: left;">
                    <div style="background: rgba(0, 212, 255, 0.1); padding: 1.5rem; border-radius: 12px; border: 1px solid rgba(0, 212, 255, 0.3);">
                        <div style="margin-bottom: 1rem;">
                            <div style="font-weight: 600; color: var(--text-primary); margin-bottom: 0.5rem;">✅ Connecté avec succès</div>
                            <div style="font-family: monospace; color: var(--text-secondary);" id="connected-wallet-address"></div>
                        </div>
                        <div class="wallet-balance-section">
                            <label style="font-weight: 600; color: var(--text-primary); display: block; margin-bottom: 0.5rem;">Balance</label>
                            <div class="wallet-balance" id="wallet-eth-balance" style="font-size: 1.3em; color: var(--accent-green);"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="hyperliquid-info" id="hyperliquid-info" style="margin-top: 2rem;">
                <!-- Blockchain info will be loaded here -->
            </div>
        </div>
    </div>

    <style>
        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            background: var(--bg-card, #1a1a2e);
            border-radius: 16px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }
        
        .modal-content h2 {
            margin-top: 0;
            margin-bottom: 0.5rem;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            font-weight: 600;
        }
        
        .modal-content label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
            font-weight: 500;
        }
        
        .modal-content input,
        .modal-content select {
            width: 100%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        
        .modal-content input:focus,
        .modal-content select:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.2);
        }
        
        .modal-content .control-btn {
            margin-top: 1rem;
            width: 100%;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, var(--accent-blue), #0066cc);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .modal-content .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.3);
        }

        /* ================================
           BACKTEST SYSTEM STYLES
           ================================ */
        .system-status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-info {
            flex: 1;
        }

        .status-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .status-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .status-details {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .status-details p {
            margin: 0.5rem 0;
            color: var(--text-secondary);
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .metric-card {
            text-align: center;
            padding: 1.5rem 1rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.1);
        }

        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .metric-value.positive {
            color: #00d4aa;
        }

        .metric-value.negative {
            color: #e17055;
        }

        .metric-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .risk-overview {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .risk-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .risk-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
        }

        .risk-label {
            color: var(--text-secondary);
        }

        .risk-value {
            font-weight: 600;
        }

        .risk-value.positive {
            color: #00d4aa;
        }

        .risk-value.negative {
            color: #e17055;
        }

        .risk-distribution h4 {
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .risk-bars {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .risk-bar-item {
            display: grid;
            grid-template-columns: 40px 1fr 30px;
            align-items: center;
            gap: 0.5rem;
        }

        .risk-bar-label {
            font-weight: 600;
            color: var(--text-primary);
        }

        .risk-bar-container {
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .risk-bar {
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .risk-bar-count {
            text-align: center;
            font-weight: 600;
            color: var(--text-primary);
        }

        .top-strategies-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .strategy-overview-card {
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.02);
            transition: transform 0.2s ease;
        }

        .strategy-overview-card.best {
            border-color: #00d4aa;
            background: rgba(0, 212, 170, 0.05);
        }

        .strategy-overview-card.worst {
            border-color: #e17055;
            background: rgba(225, 112, 85, 0.05);
        }

        .strategy-overview-card h4 {
            margin: 0 0 1rem 0;
            color: var(--text-primary);
        }

        .strategy-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        .strategy-metrics {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .metric {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .metric.positive {
            background: rgba(0, 212, 170, 0.1);
            color: #00d4aa;
        }

        .metric.negative {
            background: rgba(225, 112, 85, 0.1);
            color: #e17055;
        }

        .metric.real-data {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
        }

        .metric.simulated-data {
            background: rgba(253, 203, 110, 0.1);
            color: #fdcb6e;
        }

        .strategy-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .system-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .control-btn.primary {
            background: var(--accent-blue, #00d4ff);
            color: white;
        }

        .control-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.3);
        }

        .error-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .error-state i {
            font-size: 3rem;
            color: #e17055;
            margin-bottom: 1rem;
        }

        .loading-indicator {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .loading-indicator i {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

    </style>
    <script>
        // ================================
        // SIMPLE WALLET CONNECTION
        // ================================

        // Global wallet state
        let connectedWallet = null;
        let walletType = null;

        // Check if wallet is available
        function isWalletAvailable() {
            return typeof window !== 'undefined' && window.ethereum;
        }

        function getWalletType() {
            if (!isWalletAvailable()) return null;
            if (window.ethereum.isBraveWallet) return 'Brave Wallet';
            if (window.ethereum.isMetaMask) return 'MetaMask';
            return 'Wallet Ethereum';
        }

        // Update wallet status display
        function updateWalletStatusDisplay() {
            const infoDisplay = document.getElementById('wallet-info-display');
            const connectBtn = document.getElementById('connect-metamask-btn');
            const disconnectBtn = document.getElementById('disconnect-wallet-btn');

            if (connectedWallet) {
                infoDisplay.style.display = 'block';
                connectBtn.style.display = 'none';
                disconnectBtn.style.display = 'block';

                // Update wallet info
                document.getElementById('connected-wallet-address').textContent = connectedWallet.address;
                document.getElementById('wallet-eth-balance').textContent = connectedWallet.balance || '--';
            } else {
                infoDisplay.style.display = 'none';
                connectBtn.style.display = 'block';
                disconnectBtn.style.display = 'none';
            }
        }

        // Add HyperLiquid networks to MetaMask
        async function addHyperLiquidNetworks() {
            try {
                // HyperLiquid Mainnet
                const hyperliquidMainnet = {
                    chainId: '0x8145', // 33101 in hex
                    chainName: 'HyperLiquid Mainnet',
                    nativeCurrency: {
                        name: 'HYPE',
                        symbol: 'HYPE',
                        decimals: 18
                    },
                    rpcUrls: ['https://api.hyperliquid.xyz/'],
                    blockExplorerUrls: ['https://explorer.hyperliquid.xyz/']
                };

                // HyperLiquid Testnet
                const hyperliquidTestnet = {
                    chainId: '0x81a', // 2074 in hex
                    chainName: 'HyperLiquid Testnet',
                    nativeCurrency: {
                        name: 'HYPE',
                        symbol: 'HYPE',
                        decimals: 18
                    },
                    rpcUrls: ['https://api.hyperliquid-testnet.xyz/'],
                    blockExplorerUrls: ['https://explorer.hyperliquid.xyz/']
                };

                // Try to add mainnet
                try {
                    await window.ethereum.request({
                        method: 'wallet_addEthereumChain',
                        params: [hyperliquidMainnet]
                    });
                    console.log('HyperLiquid Mainnet added to wallet');
                } catch (error) {
                    if (error.code === -32602) {
                        console.log('HyperLiquid Mainnet already exists');
                    }
                }

                // Try to add testnet
                try {
                    await window.ethereum.request({
                        method: 'wallet_addEthereumChain',
                        params: [hyperliquidTestnet]
                    });
                    console.log('HyperLiquid Testnet added to wallet');
                } catch (error) {
                    if (error.code === -32602) {
                        console.log('HyperLiquid Testnet already exists');
                    }
                }
            } catch (error) {
                console.error('Error adding HyperLiquid networks:', error);
            }
        }

        // Get HyperLiquid balances via API
        async function getHyperLiquidBalances(account, isTestnet = false) {
            try {
                const apiUrl = 'http://localhost:7000/api/wallet/balances';

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        address: account,
                        network: isTestnet ? 'testnet' : 'mainnet'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    return data.balances;
                } else {
                    console.error('Failed to get HyperLiquid balances:', data.error);
                    return null;
                }
            } catch (error) {
                console.error('Error fetching HyperLiquid balances:', error);
                return null;
            }
        }

        // Connect wallet
        async function connectWallet() {
            if (!isWalletAvailable()) {
                alert('❌ Aucun wallet détecté\n\nVeuillez installer MetaMask pour continuer.');
                return;
            }

            const connectBtn = document.getElementById('connect-metamask-btn');
            connectBtn.disabled = true;
            connectBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion...';

            try {
                // Automatically add HyperLiquid networks to MetaMask
                await addHyperLiquidNetworks();

                // Request account access
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const account = accounts[0];

                // Get network
                const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                const networkNames = {
                    '0x1': 'Ethereum Mainnet',
                    '0x5': 'Goerli Testnet',
                    '0xaa36a7': 'Sepolia Testnet',
                    '0x89': 'Polygon Mainnet',
                    '0x13881': 'Mumbai Testnet',
                    '0x8145': 'HyperLiquid Mainnet', // 33101
                    '0x81a': 'HyperLiquid Testnet'  // 2074
                };
                const network = networkNames[chainId] || `Chain ID: ${chainId}`;

                // Check if we're on HyperLiquid
                const isHyperLiquid = chainId === '0x8145' || chainId === '0x81a';
                const isTestnet = chainId === '0x81a';

                let balanceDisplay = '--';
                let balances = null;

                if (isHyperLiquid) {
                    // We're on HyperLiquid - get real HyperLiquid balances
                    console.log('📊 Récupération des balances HyperLiquid...');
                    balances = await getHyperLiquidBalances(account, isTestnet);

                    if (balances && balances.length > 0) {
                        // Format the balances nicely (show top 3 tokens)
                        const topBalances = balances.slice(0, 3);
                        const formattedBalances = topBalances.map(bal => {
                            return `${bal.token}: ${Number(bal.balance).toFixed(4)}`;
                        }).join(' • ');

                        balanceDisplay = formattedBalances;
                        console.log('✅ Balances HyperLiquid récupérées:', balances);
                    } else {
                        // Fallback to HYPE balance if API fails
                        try {
                            const balance = await window.ethereum.request({
                                method: 'eth_getBalance',
                                params: [account, 'latest']
                            });
                            const hypeBalance = parseInt(balance, 16) / Math.pow(10, 18);
                            balanceDisplay = `HYPE: ${hypeBalance.toFixed(4)}`;
                        } catch (error) {
                            console.error('Error getting HYPE balance:', error);
                        }
                    }
                } else {
                    // Not on HyperLiquid, get ETH balance
                    console.log('📊 Récupération de la balance ETH...');
                    const balance = await window.ethereum.request({
                        method: 'eth_getBalance',
                        params: [account, 'latest']
                    });
                    const ethBalance = parseInt(balance, 16) / Math.pow(10, 18);
                    balanceDisplay = `ETH: ${ethBalance.toFixed(4)}`;
                }

                connectedWallet = {
                    address: account,
                    balance: balanceDisplay,
                    network: network,
                    hyperliquidBalances: balances,
                    isHyperLiquid: isHyperLiquid
                };
                walletType = getWalletType();

                updateWalletStatusDisplay();

                // Store in localStorage for persistence
                localStorage.setItem('novaquote_wallet', JSON.stringify(connectedWallet));
                localStorage.setItem('novaquote_wallet_type', walletType);

                if (isHyperLiquid) {
                    showNotification(`✅ Connecté à HyperLiquid - ${account.substring(0, 6)}...${account.substring(account.length - 4)}`, 'success');
                } else {
                    showNotification(`✅ Connecté - ${account.substring(0, 6)}...${account.substring(account.length - 4)}`, 'success');
                }

            } catch (error) {
                console.error('Erreur de connexion wallet:', error);
                showNotification(`❌ Erreur: ${error.message}`, 'error');
            } finally {
                connectBtn.disabled = false;
                connectBtn.innerHTML = '<i class="fab fa-ethereum"></i> Connecter MetaMask';
            }
        }

        // Disconnect wallet
        function disconnectWallet() {
            connectedWallet = null;
            walletType = null;

            // Clear localStorage
            localStorage.removeItem('novaquote_wallet');
            localStorage.removeItem('novaquote_wallet_type');

            updateWalletStatusDisplay();
            showNotification('🔌 Wallet déconnecté', 'info');
        }

        // Load wallet from localStorage on page load
        function loadWalletFromStorage() {
            const storedWallet = localStorage.getItem('novaquote_wallet');
            const storedType = localStorage.getItem('novaquote_wallet_type');

            if (storedWallet && storedType) {
                connectedWallet = JSON.parse(storedWallet);
                walletType = storedType;
                updateWalletStatusDisplay();
                console.log('Wallet chargé depuis le stockage local');
            }
        }

        // Listen for account changes
        if (isWalletAvailable()) {
            window.ethereum.on('accountsChanged', (accounts) => {
                if (accounts.length === 0) {
                    disconnectWallet();
                } else if (accounts[0] !== connectedWallet?.address) {
                    disconnectWallet();
                }
            });

            window.ethereum.on('chainChanged', (chainId) => {
                if (connectedWallet) {
                    const networkNames = {
                        '0x1': 'Ethereum Mainnet',
                        '0x5': 'Goerli Testnet',
                        '0xaa36a7': 'Sepolia Testnet',
                        '0x89': 'Polygon Mainnet',
                        '0x13881': 'Mumbai Testnet',
                        '0x8145': 'HyperLiquid Mainnet',
                        '0x81a': 'HyperLiquid Testnet'
                    };
                    connectedWallet.network = networkNames[chainId] || `Chain ID: ${chainId}`;
                    updateWalletStatusDisplay();
                    localStorage.setItem('novaquote_wallet', JSON.stringify(connectedWallet));
                }
            });
        }

        // Show notification
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: var(--accent-blue);
                color: white;
                padding: 1rem 1.5rem;
                border-radius: 8px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
                z-index: 10000;
                font-size: 0.9rem;
                font-weight: 500;
                animation: slideIn 0.3s ease;
            `;
            notification.innerHTML = message;

            // Add to page
            document.body.appendChild(notification);

            // Remove after 3 seconds
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.parentNode.removeChild(notification);
                }
            }, 3000);
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Config page initialized - Simple Wallet Connection');

            // Load wallet from storage
            loadWalletFromStorage();

            // Setup wallet connection buttons
            document.getElementById('connect-metamask-btn').addEventListener('click', connectWallet);
            document.getElementById('disconnect-wallet-btn').addEventListener('click', disconnectWallet);
        });
    </script>
</body>
</html>
